<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlayComputer — Compilador Web</title>
<style>
  :root{
    --bg:#0d1117;
    --panel:#161b22;
    --border:#2a313c;
    --accent:#7c5cff;
    --accent2:#22d3a5;
    --text:#e6edf3;
    --muted:#8b949e;
    --danger:#ff5c5c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI',Roboto,Arial,sans-serif;
    background:radial-gradient(circle at top left,#1b1030,var(--bg) 60%);
    color:var(--text);
    min-height:100vh;
  }
  .app{max-width:820px;margin:0 auto;padding:20px;}
  h1{
    font-size:1.6rem;
    margin:0 0 4px 0;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .subtitle{color:var(--muted);margin:0 0 20px 0;font-size:.9rem;}
  .main{display:flex;flex-direction:column;gap:18px;}
  .editor-panel{width:100%;}
  .monitor-panel{width:100%;}
  textarea{
    width:100%;
    height:340px;
    background:#0a0e14;
    color:#c9d1d9;
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px;
    font-family:'Fira Code',Consolas,monospace;
    font-size:13.5px;
    resize:vertical;
    line-height:1.5;
  }
  .controls{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}
  button{
    border:none;
    border-radius:8px;
    padding:10px 16px;
    font-size:.9rem;
    font-weight:600;
    cursor:pointer;
    transition:transform .12s ease, opacity .12s ease;
  }
  button:active{transform:scale(.96);}
  #btnPlay{background:linear-gradient(90deg,var(--accent),#9b7bff);color:#fff;}
  #btnStop{background:#2a313c;color:var(--text);}
  #btnDownload{background:linear-gradient(90deg,var(--accent2),#0fb987);color:#04231a;}
  button:hover{opacity:.9;}
  .log{
    margin-top:12px;
    min-height:20px;
    color:var(--muted);
    font-size:.82rem;
    padding:8px 2px;
    border-top:1px dashed var(--border);
  }
  .monitor-panel h2{
    font-size:1rem;
    color:var(--muted);
    margin:0 0 12px 0;
    text-transform:uppercase;
    letter-spacing:.06em;
  }
  .channels{
    display:flex;
    flex-direction:column;
    gap:8px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px;
    min-height:80px;
  }
  .empty{color:var(--muted);font-size:.85rem;margin:0;}
  .channel{
    display:flex;
    align-items:center;
    gap:10px;
    background:#10151d;
    border:1px solid var(--border);
    border-radius:8px;
    padding:8px 10px;
    transition:box-shadow .1s ease, border-color .1s ease;
  }
  .channel .dot{
    width:10px;height:10px;border-radius:50%;
    background:#3a4250;
    flex-shrink:0;
  }
  .channel.active{
    border-color:var(--accent2);
    box-shadow:0 0 12px 1px rgba(34,211,165,.55);
  }
  .channel.active .dot{
    background:var(--accent2);
    box-shadow:0 0 8px 2px var(--accent2);
  }
  .cname{font-weight:600;font-size:.85rem;}
  .ctags{color:var(--muted);font-size:.72rem;margin-left:auto;text-align:right;}
</style>
</head>
<body>
<div class="app">
  <h1>PlayComputer</h1>
  <p class="subtitle">Compilador e player web para a linguagem musical PlayComputer</p>
  <div class="main">
    <div class="editor-panel">
      <textarea id="code" spellcheck="false">compass standard
scale standard
bpm 100
metronome active

play piano part {
    atribute {
        id = "melodia"
    }
    repeat(3) {
        note(1) rhythm(4),
        note(2) rhythm(4),
        note(3) rhythm(4),
        tone(^)
    }
}

play drum part {
    atribute {
        id = "bateria"
    }
    note(1) rhythm(4),
    note(4) rhythm(4),
    note(1) rhythm(4),
    note(7) rhythm(2),
}

play guitar part {
    atribute {
        id = "base"
    }
    chord(1, 3, 5) rhythm(2),
    chord(4, 6, 1[8+]) rhythm(2),
}

#bateria.repeat(2)
#base.escape(8)
</textarea>
      <div class="controls">
        <button id="btnPlay">▶ Tocar Agora</button>
        <button id="btnStop">⏹ Parar</button>
        <button id="btnDownload">⬇ Baixar Áudio (.wav)</button>
      </div>
      <div class="log" id="log">Pronto.</div>
    </div>
    <div class="monitor-panel">
      <h2>Canais ativos</h2>
      <div class="channels" id="channels"><p class="empty">Nenhum canal compilado ainda.</p></div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
