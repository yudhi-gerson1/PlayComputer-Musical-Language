<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlayComputer v1.1 — Compilador Web</title>
<style>
  :root{
    --bg:#0d1117;
    --panel:#161b22;
    --border:#2a313c;
    --accent:#7c5cff;
    --accent2:#22d3a5;
    --text:#e6edf3;
    --muted:#8b949e;
    --danger:#ff5c5c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI',Roboto,Arial,sans-serif;
    background:radial-gradient(circle at top left,#1b1030,var(--bg) 60%);
    color:var(--text);
    min-height:100vh;
  }
  .app{max-width:820px;margin:0 auto;padding:20px;}
  h1{
    font-size:1.6rem;
    margin:0 0 4px 0;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .subtitle{color:var(--muted);margin:0 0 20px 0;font-size:.9rem;}
  .main{display:flex;flex-direction:column;gap:18px;}
  .editor-panel{width:100%;}
  .monitor-panel{width:100%;}
  textarea{
    width:100%;
    height:340px;
    background:#0a0e14;
    color:#c9d1d9;
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px;
    font-family:'Fira Code',Consolas,monospace;
    font-size:13.5px;
    resize:vertical;
    line-height:1.5;
  }
  .controls{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}
  button{
    border:none;
    border-radius:8px;
    padding:10px 16px;
    font-size:.9rem;
    font-weight:600;
    cursor:pointer;
    transition:transform .12s ease, opacity .12s ease;
  }
  button:active{transform:scale(.96);}
  #btnPlay{background:linear-gradient(90deg,var(--accent),#9b7bff);color:#fff;}
  #btnStop{background:#2a313c;color:var(--text);}
  #btnDownload{background:linear-gradient(90deg,var(--accent2),#0fb987);color:#04231a;}
  /* ADIÇÃO: botão Compartilhar, cor neutra para não competir visualmente
     com o botão principal (Tocar) nem parecer uma ação destrutiva. */
  #btnShare{background:#2a2f45;color:var(--text);border:1px solid var(--border);}
  button:hover{opacity:.9;}
  .log{
    margin-top:12px;
    min-height:20px;
    color:var(--muted);
    font-size:.82rem;
    padding:8px 2px;
    border-top:1px dashed var(--border);
  }
  .monitor-panel h2{
    font-size:1rem;
    color:var(--muted);
    margin:0 0 12px 0;
    text-transform:uppercase;
    letter-spacing:.06em;
  }
  .channels{
    display:flex;
    flex-direction:column;
    gap:8px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px;
    min-height:80px;
  }
  .empty{color:var(--muted);font-size:.85rem;margin:0;}
  .channel{
    display:flex;
    align-items:center;
    gap:10px;
    background:#10151d;
    border:1px solid var(--border);
    border-radius:8px;
    padding:8px 10px;
    transition:box-shadow .1s ease, border-color .1s ease;
  }
  .channel .dot{
    width:10px;height:10px;border-radius:50%;
    background:#3a4250;
    flex-shrink:0;
  }
  .channel.active{
    border-color:var(--accent2);
    box-shadow:0 0 12px 1px rgba(34,211,165,.55);
  }
  .channel.active .dot{
    background:var(--accent2);
    box-shadow:0 0 8px 2px var(--accent2);
  }
  .cname{font-weight:600;font-size:.85rem;}
  .ctags{color:var(--muted);font-size:.72rem;margin-left:auto;text-align:right;}
</style>
</head>
<body>
<div class="app">
  <h1>PlayComputer v1.1</h1>
  <p class="subtitle">Compilador e player web para a linguagem musical PlayComputer</p>
  <div class="main">
    <div class="editor-panel">
      <!-- CORREÇÃO: os sinais < e > da sintaxe de variável de parte
           (<melodia>) foram escapados como &lt; e &gt; aqui no HTML-fonte.
           O navegador decodifica isso automaticamente ao exibir dentro da
           textarea, então o usuário continua vendo/editando <melodia>
           normalmente — isso só evita qualquer ambiguidade de parsing
           HTML dentro da tag <textarea>. -->
      <textarea id="code" spellcheck="false">compass standard
scale C minor
bpm 120
stdOctave 4

&lt;melodia&gt; part {
    [8+] {
        note(1, 3, 5) rhythm(4.),
        repeatEach(3, 2) {
            note(5) rhythm(8),
            note(8) rhythm(4)
        }
    }
}

play violin, saxophone {
    atribute {
        ids = "solista_v", "solista_s"
        class = "dueto"
        type = reverb
        articul = legato
        fade = in: quiet 30%, out: quiet 50%
        volume = 85%
        speed = 1.2x
    }
    
    repeat(2) {
        &lt;melodia&gt;.tone(^)
    }
}

play synthBass {
    atribute {
        id = "baixo"
        type = distorted
        articul = staccato
        speed = 100%
        volume = 90%
    }
    
    note(1, 1, 4, 5)[8-2] rhythm(4)
}
</textarea>
      <div class="controls">
        <button id="btnPlay">▶ Tocar Agora</button>
        <button id="btnStop">⏹ Parar</button>
        <button id="btnDownload">⬇ Baixar Áudio (.wav)</button>
        <!-- ADIÇÃO: botão de compartilhamento, gera um link com o código
             embutido (base64 no #hash da URL) e copia para a área de
             transferência. -->
        <button id="btnShare">🔗 Compartilhar</button>
      </div>
      <div class="log" id="log">Pronto.</div>
    </div>
    <div class="monitor-panel">
      <h2>Canais ativos</h2>
      <div class="channels" id="channels"><p class="empty">Nenhum canal compilado ainda.</p></div>
    </div>
  </div>
</div>

<!-- Módulos de Utilidade e Teoria Musical -->
<script src="core-utils.js"></script>
<script src="theory.js"></script>

<!-- Módulos do Parser (AST & Compilação) -->
<script src="parser-statements.js"></script>
<script src="parser-vars.js"></script>
<script src="parser-play.js"></script>

<!-- Scheduler de Eventos e Motor Áudio Web -->
<script src="scheduler.js"></script>
<script src="synth-instruments.js"></script>
<script src="synth-drum.js"></script>
<script src="synth-effects.js"></script>

<!-- Renderização Offline e Exportação -->
<script src="audio-export.js"></script>

<!-- Compartilhamento de código via link -->
<script src="share.js"></script>

<!-- Interface do Usuário e Orquestrador Principal -->
<script src="ui.js"></script>
<script src="main.js"></script>
</body>
</html>
